<!DOCTYPE html>
<!-- ================================================
     页面：月卡管理列表页 monthCard.html
     说明：园区后台管理系统 - 三页面之一（月卡列表）
           功能：查询筛选 / 添加月卡跳转 / 表格渲染 / 查看-编辑-续费弹窗 /
                 单条删除 / 全选与批量删除 / 前端分页 / localStorage 持久化
           数据与视图分离：renderTable() 渲染表格，修改数据后重新渲染
     ================================================ -->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>月卡管理 - 园区后台管理系统</title>
    <style>
        /* ============================================
           公共样式（三个页面共用同一套布局样式）
           整体结构：左侧侧边栏 + 右侧主区域（顶栏 + 内容）
           ============================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background: #f0f2f5;
            color: #333;
            min-width: 900px;
        }
        a { text-decoration: none; color: inherit; }
        ul { list-style: none; }

        /* 大容器：侧边栏 + 主区域左右并排 */
        .layout { display: flex; min-height: 100vh; }

        /* ---------- 左侧侧边栏 ---------- */
        .sidebar {
            width: 220px;
            background: #2f4050;
            overflow: hidden;
            transition: width 0.3s;
        }
        /* 侧边栏内部再包一层固定宽度，保证收起时文字不换行 */
        .sidebar-inner { width: 220px; }
        /* 收起状态：宽度变为 0（配合顶栏折叠按钮） */
        .sidebar.collapsed { width: 0; }

        /* 顶部标题栏（侧边栏内） */
        .logo {
            height: 60px;
            line-height: 60px;
            text-align: center;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            background: #263445;
            white-space: nowrap;
        }

        /* 一级菜单项 */
        .menu-item {
            display: block;
            height: 46px;
            line-height: 46px;
            padding: 0 20px;
            color: #a7b1c2;
            cursor: pointer;
            white-space: nowrap;
            position: relative;
        }
        .menu-item:hover { background: #263445; color: #fff; }
        /* 选中高亮：给当前页面对应的菜单项加 active 类 */
        .menu-item.active { background: #409eff; color: #fff; }

        /* 有子菜单的父级右侧箭头（用 CSS 画小三角） */
        .menu-item .arrow {
            position: absolute;
            right: 18px;
            top: 50%;
            margin-top: -2px;
            width: 0;
            height: 0;
            border: 5px solid transparent;
            border-top-color: #a7b1c2;
            transition: transform 0.3s;
        }
        /* 父级展开时箭头旋转 180 度 */
        li.open > .menu-item .arrow { transform: rotate(180deg); }

        /* 子菜单：默认隐藏，父级加 open 类后显示 */
        .submenu { display: none; background: #22303d; }
        li.open > .submenu { display: block; }
        .submenu a {
            display: block;
            height: 40px;
            line-height: 40px;
            padding-left: 46px;
            color: #9aa7b5;
            white-space: nowrap;
        }
        .submenu a:hover { color: #fff; }
        /* 子菜单选中高亮 */
        .submenu a.active { color: #409eff; font-weight: bold; }

        /* ---------- 右侧主区域 ---------- */
        .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

        /* 顶部头部：左侧折叠按钮 + 系统名称，右侧登录账号 */
        .topbar {
            height: 60px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
        }
        .topbar-left { display: flex; align-items: center; }
        /* 折叠按钮：用三条 CSS 横线画图标 */
        .toggle-btn {
            width: 34px;
            height: 34px;
            margin-right: 14px;
            border: 1px solid #dcdfe6;
            background: #fff;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
        }
        .toggle-btn span { display: block; width: 16px; height: 2px; background: #333; }
        .system-name { font-size: 17px; font-weight: bold; }

        /* 右侧登录账号区域 */
        .account { display: flex; align-items: center; }
        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #409eff;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            margin-right: 8px;
        }
        .user-name { font-size: 14px; }

        /* 内容区 */
        .content { padding: 20px; }
        /* 每个页面的标题条 */
        .page-title {
            background: #fff;
            padding: 14px 20px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
        }

        /* ============================================
           本页面样式：月卡管理列表页
           ============================================ */

        /* ---------- 查询筛选区域 ---------- */
        .filter-bar {
            background: #fff;
            border-radius: 6px;
            padding: 14px 20px;
            margin-bottom: 16px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        .filter-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .filter-left label { font-size: 14px; color: #606266; }
        .filter-left input, .filter-left select {
            height: 34px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            padding: 0 10px;
            font-size: 14px;
            outline: none;
        }
        .filter-left input { width: 220px; }
        .filter-left input:focus, .filter-left select:focus { border-color: #409eff; }
        .filter-right { display: flex; gap: 10px; }

        /* ---------- 通用按钮 ---------- */
        .btn {
            height: 34px;
            padding: 0 16px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            background: #fff;
            color: #333;
            font-size: 14px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn:hover { border-color: #409eff; color: #409eff; }
        .btn-primary { background: #409eff; border-color: #409eff; color: #fff; }
        .btn-primary:hover { background: #66b1ff; color: #fff; }
        .btn-success { background: #67c23a; border-color: #67c23a; color: #fff; }
        .btn-success:hover { background: #85ce61; color: #fff; }
        .btn-danger { background: #f56c6c; border-color: #f56c6c; color: #fff; }
        .btn-danger:hover { background: #f78989; color: #fff; }
        .btn.disabled { background: #f0f0f0; border-color: #e0e0e0; color: #b0b0b0; cursor: not-allowed; }
        .btn.disabled:hover { border-color: #e0e0e0; color: #b0b0b0; }

        /* ---------- 表格 ---------- */
        .table-card {
            background: #fff;
            border-radius: 6px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
            overflow: hidden;
        }
        table { width: 100%; border-collapse: collapse; }
        th, td {
            border-bottom: 1px solid #ebeef5;
            padding: 11px 10px;
            text-align: center;
            font-size: 14px;
        }
        th { background: #fafafa; color: #606266; font-weight: normal; white-space: nowrap; }
        tbody tr:hover { background: #f5f7fa; }
        td { color: #333; }
        .empty-row { color: #909399; padding: 40px 0; }

        /* 状态小标签 */
        .tag {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 12px;
        }
        .tag-green { background: #f0f9eb; color: #67c23a; border: 1px solid #e1f3d8; }
        .tag-red { background: #fef0f0; color: #f56c6c; border: 1px solid #fde2e2; }

        /* 操作链接 */
        .link {
            color: #409eff;
            cursor: pointer;
            margin-right: 8px;
            font-size: 13px;
            background: none;
            border: none;
            font-family: inherit;
        }
        .link:hover { text-decoration: underline; }
        .link-danger { color: #f56c6c; }
        .link-danger:hover { text-decoration: underline; }

        /* ---------- 分页 ---------- */
        .pagination {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            padding: 14px 20px;
            font-size: 14px;
            color: #606266;
        }
        .pagination select { height: 30px; border: 1px solid #dcdfe6; border-radius: 4px; }
        .pagination b { color: #409eff; }

        /* ---------- 弹窗（查看 / 编辑 / 续费 共用） ---------- */
        .modal-mask {
            position: fixed;
            left: 0;
            top: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.45);
            display: none;      /* 默认隐藏，加 show 类后显示 */
            align-items: center;
            justify-content: center;
            z-index: 999;
        }
        .modal-mask.show { display: flex; }
        .modal {
            width: 620px;
            max-height: 90vh;
            background: #fff;
            border-radius: 8px;
            overflow: auto;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            border-bottom: 1px solid #ebeef5;
            font-size: 16px;
            font-weight: bold;
        }
        .modal-close {
            cursor: pointer;
            color: #909399;
            font-size: 20px;
            line-height: 1;
            border: none;
            background: none;
        }
        .modal-close:hover { color: #f56c6c; }

        /* 弹窗表单：两列布局 */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px 18px;
            padding: 20px;
        }
        .field { display: block; }
        .field label {
            display: block;
            font-size: 13px;
            color: #606266;
            margin-bottom: 6px;
        }
        .field label .red { color: #f56c6c; }
        .field input, .field select {
            width: 100%;
            height: 34px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            padding: 0 10px;
            font-size: 14px;
            outline: none;
            background: #fff;
            color: #333;
        }
        .field input:focus, .field select:focus { border-color: #409eff; }
        /* 只读输入框样式 */
        .field input[readonly] { background: #f5f7fa; color: #909399; cursor: not-allowed; }

        /* 弹窗底部 */
        .modal-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            border-top: 1px solid #ebeef5;
        }
        .modal-error { color: #f56c6c; font-size: 13px; }
        .modal-footer .btns { display: flex; gap: 10px; }
    </style>
</head>
<body>
    <div class="layout">
        <!-- ============ 左侧侧边导航栏 ============ -->

        <!-- ============ 右侧主区域 ============ -->

    <!-- ============ 弹窗（查看 / 编辑 / 续费 共用同一个弹窗） ============ -->
    <div class="modal-mask" id="modalMask">
        <div class="modal">
            <div class="modal-header">
                <span id="modalTitle">查看月卡</span>
                <button class="modal-close" id="modalClose" title="关闭">×</button>

            <form id="modalForm" class="form-grid">

    <script>
        /* ============================================
           数据源定义（与 index.html 保持一致，共用同一 localStorage key）
           ============================================ */
        var STORAGE_KEY = 'monthCardData'; // localStorage 存储 key（勿改，多页面共用）

        /* 默认模拟月卡数据：localStorage 中没有数据时首次加载使用 */
        function getDefaultCards() {
            return [
                { id: 1001, plate: '赣A12345', ownerName: '张伟', phone: '13800000001', payAmount: 3600, startDate: '2026-01-01', endDate: '2026-12-31' },
                { id: 1002, plate: '京B88888', ownerName: '李娜', phone: '13900000002', payAmount: 3600, startDate: '2026-01-15', endDate: '2027-01-14' },
                { id: 1003, plate: '粤C66666', ownerName: '王强', phone: '13700000003', payAmount: 1800, startDate: '2026-03-01', endDate: '2026-08-31' },
                { id: 1004, plate: '浙D77777', ownerName: '赵敏', phone: '13600000004', payAmount: 1200, startDate: '2025-11-01', endDate: '2026-09-01' },
                { id: 1005, plate: '苏E55555', ownerName: '陈杰', phone: '13500000005', payAmount: 2400, startDate: '2026-06-01', endDate: '2027-05-31' },
                { id: 1006, plate: '沪A99999', ownerName: '刘芳', phone: '13400000006', payAmount: 3600, startDate: '2026-07-01', endDate: '2027-06-30' }
            ];
        }

        /* ============================================
           localStorage 读写函数
           ============================================ */

        // 读取月卡数据：localStorage 有数据则读取，没有则写入默认模拟数据
        function readMonthCardData() {
            var data = localStorage.getItem(STORAGE_KEY);
            var list;
            if (data === null) {
                list = getDefaultCards(); // 本地没有数据：使用默认模拟数据
            } else {
                list = JSON.parse(data);  // 本地有数据：还原成数组
            }
            // 每次读取时按当前日期刷新剩余天数与状态
            for (var i = 0; i < list.length; i++) {
                updateCardState(list[i]);
            }
            saveMonthCardData(list); // 刷新后存回
            return list;
        }

        // 保存月卡数据
        function saveMonthCardData(list) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
        }

        /* ============================================
           工具函数
           ============================================ */

        // 千分位格式化：1200 -> "1,200"
        function formatMoney(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        }

        // 补零
        function padZero(n) {
            return n < 10 ? '0' + n : '' + n;
        }

        // 今天的日期字符串：2026-09-07
        function getToday() {
            var d = new Date();
            return d.getFullYear() + '-' + padZero(d.getMonth() + 1) + '-' + padZero(d.getDate());
        }

        // 两个日期字符串相差的天数（dateStr2 - dateStr1）
        function daysBetween(dateStr1, dateStr2) {
            var a = dateStr1.split('-');
            var b = dateStr2.split('-');
            var t1 = Date.UTC(Number(a[0]), Number(a[1]) - 1, Number(a[2]));
            var t2 = Date.UTC(Number(b[0]), Number(b[1]) - 1, Number(b[2]));
            return Math.round((t2 - t1) / (24 * 60 * 60 * 1000));
        }

        // 刷新单张月卡：剩余天数 remainDay / 状态 status（0 可用，1 已过期）
        function updateCardState(card) {
            var today = getToday();
            card.remainDay = daysBetween(today, card.endDate);
            if (card.remainDay < 0) {
                card.remainDay = 0;
            }
            card.status = (card.endDate < today) ? 1 : 0;
        }

        // 状态数字转文字：0 -> "可用"，1 -> "已过期"
        function formatStatusText(status) {
            return status === 0 ? '可用' : '已过期';
        }

        var PLATE_REG = /^[\u4e00-\u9fa5][A-Z][A-Z0-9]{5}$/;
        // 手机号正则：1 开头 + 3-9 + 9 位数字
        var PHONE_REG = /^1[3-9]\d{9}$/;

        /* ============================================
           页面全局数据（内存数据源）
           ============================================ */
        var allCards = [];      // 全部月卡数据（数据源）
        var filteredCards = []; // 查询过滤后的数据
        var currentPage = 1;    // 当前页码
        var pageSize = 5;       // 每页条数

        // 根据 id 在全部数据中查找一张月卡
        function findCardById(id) {
            for (var i = 0; i < allCards.length; i++) {
                if (allCards[i].id === id) {
                    return allCards[i];
                }
            }
            return null;
        }

        /* ============================================
           渲染函数：renderTable() 动态生成表格行 DOM
           （修改数据后调用它重新渲染，实现数据与视图分离）
           ============================================ */
        function renderTable() {
            var tbody = document.getElementById('tableBody');

            // 1. 分页切片：从过滤后的数组中截取当前页要显示的数据
            var totalPages = getTotalPages();
            // 页码越界保护（比如删除数据后当前页可能没有数据了）
            if (currentPage > totalPages) {
                currentPage = totalPages;
            }
            var start = (currentPage - 1) * pageSize;
            var pageCards = filteredCards.slice(start, start + pageSize);

            // 2. 没有数据时显示空提示行
            if (pageCards.length === 0) {
                tbody.innerHTML = '<tr><td colspan="11" class="empty-row">暂无月卡数据</td></tr>';
                updatePageInfo();
                return;
            }

            // 3. 遍历当前页数据，拼接表格行 HTML
            var html = '';
            for (var i = 0; i < pageCards.length; i++) {
                var c = pageCards[i];
                // 状态小标签：0 可用（绿），1 已过期（红）
                var tagClass = (c.status === 0) ? 'tag-green' : 'tag-red';
                var tagHtml = '<span class="tag ' + tagClass + '">' + formatStatusText(c.status) + '</span>';
                html += '<tr>' +
                    '<td><input type="checkbox" class="rowCheck" data-id="' + c.id + '"></td>' +
                    '<td>' + c.id + '</td>' +
                    '<td>' + c.plate + '</td>' +
                    '<td>' + c.ownerName + '</td>' +
                    '<td>' + c.phone + '</td>' +
                    '<td>' + formatMoney(c.payAmount) + '</td>' +
                    '<td>' + c.startDate + '</td>' +
                    '<td>' + c.endDate + '</td>' +
                    '<td>' + c.remainDay + ' 天</td>' +
                    '<td>' + tagHtml + '</td>' +
                    '<td>' +
                    '<button class="link" onclick="openView(' + c.id + ')">查看</button>' +
                    '<button class="link" onclick="openEdit(' + c.id + ')">编辑</button>' +
                    '<button class="link" onclick="openRenew(' + c.id + ')">续费</button>' +
                    '<button class="link link-danger" onclick="deleteOne(' + c.id + ')">删除</button>' +
                    '</td>' +
                    '</tr>';
            }
            tbody.innerHTML = html;

            // 4. 更新分页信息与全选状态
            updatePageInfo();
            syncCheckAll();
        }

        // 计算总页数（至少 1 页）
        function getTotalPages() {
            var n = filteredCards.length;
            return n === 0 ? 1 : Math.ceil(n / pageSize);
        }

        // 更新“共几条 / 第几页”等分页文字，并控制上一页/下一页按钮
        function updatePageInfo() {
            var totalPages = getTotalPages();
            document.getElementById('totalCount').textContent = filteredCards.length;
            document.getElementById('curPageText').textContent = currentPage;
            document.getElementById('totalPageText').textContent = totalPages;

            var btnPrev = document.getElementById('btnPrev');
            var btnNext = document.getElementById('btnNext');
            // 在第一页时“上一页”不可用；在最后一页时“下一页”不可用
            if (currentPage <= 1) {
                btnPrev.classList.add('disabled');
            } else {
                btnPrev.classList.remove('disabled');
            }
            if (currentPage >= totalPages) {
                btnNext.classList.add('disabled');
            } else {
                btnNext.classList.remove('disabled');
            }
        }

        // 根据表格里的勾选情况同步“全选”复选框状态
        function syncCheckAll() {
            var checks = document.querySelectorAll('.rowCheck');
            var allChecked = true;
            for (var i = 0; i < checks.length; i++) {
                if (!checks[i].checked) {
                    allChecked = false;
                    break;
                }
            }
            document.getElementById('checkAll').checked = (checks.length > 0) && allChecked;
        }

        /* ============================================
           查询 / 重置
           ============================================ */

        // 查询：按关键字 + 状态过滤，重置页码为第 1 页后重新渲染
        function doSearch() {
            var keyword = document.getElementById('searchKeyword').value.trim();
            var statusVal = document.getElementById('searchStatus').value;

            // 用 filter() 对数组做条件过滤（关键字模糊匹配车牌/车主/手机号）
            filteredCards = allCards.filter(function (c) {
                var matchKeyword = true;
                if (keyword !== '') {
                    matchKeyword = (c.plate.indexOf(keyword) >= 0) ||
                        (c.ownerName.indexOf(keyword) >= 0) ||
                        (c.phone.indexOf(keyword) >= 0);
                }
                var matchStatus = true;
                if (statusVal !== '') {
                    matchStatus = (String(c.status) === statusVal);
                }
                return matchKeyword && matchStatus;
            });

            currentPage = 1;
            renderTable();
        }

        function doReset() {
            document.getElementById('searchKeyword').value = '';
            document.getElementById('searchStatus').value = '';
            filteredCards = allCards.slice(); 
            currentPage = 1;
            renderTable();
        }

        /* ============================================
           弹窗逻辑（查看 / 编辑 / 续费 复用同一个弹窗）
           ============================================ */
        var modalMode = 'view'; // 当前弹窗模式：view / edit / renew
        var modalCardId = null; // 当前弹窗对应的月卡 id

        // 显示弹窗并回填数据，mode 为 view / edit / renew，id 为月卡编号
        function openModal(mode, id) {
            var card = findCardById(id);
            if (card === null) {
                return;
            }
            modalMode = mode;
            modalCardId = id;

            // 回填全部字段
            document.getElementById('fId').value = card.id;
            document.getElementById('fPlate').value = card.plate;
            document.getElementById('fOwner').value = card.ownerName;
            document.getElementById('fPhone').value = card.phone;
            document.getElementById('fPay').value = card.payAmount;
            document.getElementById('fStart').value = card.startDate;
            document.getElementById('fEnd').value = card.endDate;
            document.getElementById('fRemark').value = card.remark || '';

            var modalTitle = document.getElementById('modalTitle');
            var modalSave = document.getElementById('modalSave');
            var modalCancel = document.getElementById('modalCancel');

            if (mode === 'view') {
                // ---- 查看模式：标题“查看月卡”，全部字段只读，只能关闭 ----
                modalTitle.textContent = '查看月卡';
                setFormReadonly(true);
                modalSave.style.display = 'none';   // 查看时没有“保存”按钮
                modalCancel.textContent = '关闭';
            } else if (mode === 'edit') {
                // ---- 编辑模式：标题“编辑月卡”，全部字段可修改 ----
                modalTitle.textContent = '编辑月卡';
                setFormReadonly(false);
                modalSave.style.display = '';
                modalCancel.textContent = '取消';
            } else {
                // ---- 续费模式：标题“续费”，只允许改缴费相关，车辆信息只读 ----
                modalTitle.textContent = '续费';
                setFormReadonly(false);
                // 车辆信息字段置为只读：车牌、车主、手机号
                document.getElementById('fPlate').readOnly = true;
                document.getElementById('fOwner').readOnly = true;
                document.getElementById('fPhone').readOnly = true;
                modalSave.style.display = '';
                modalCancel.textContent = '取消';
            }

            // 根据结束日期自动刷新剩余天数与状态显示
            refreshModalState();

            // 清空上次的错误提示并显示弹窗
            document.getElementById('modalError').textContent = '';
            document.getElementById('modalMask').classList.add('show');
        }

        // 快捷入口：查看 / 编辑 / 续费
        function openView(id) { openModal('view', id); }
        function openEdit(id) { openModal('edit', id); }
        function openRenew(id) { openModal('renew', id); }

        // 设置表单里除“编号/剩余天数/状态/说明”外全部字段是否只读
        function setFormReadonly(isReadonly) {
            var ids = ['fPlate', 'fOwner', 'fPhone', 'fPay', 'fStart', 'fEnd'];
            for (var i = 0; i < ids.length; i++) {
                document.getElementById(ids[i]).readOnly = isReadonly;
            }
        }

        // 关闭弹窗
        function closeModal() {
            document.getElementById('modalMask').classList.remove('show');
            modalCardId = null;
        }

        // 当结束日期变化时（或每次打开弹窗时）调用：
        // 按“结束日期 - 今天”自动计算剩余天数与状态并显示
        function refreshModalState() {
            var endDate = document.getElementById('fEnd').value;
            if (endDate === '') {
                document.getElementById('fRemain').value = '';
                document.getElementById('fStatus').value = '';
                return;
            }
            var today = getToday();
            var remain = daysBetween(today, endDate);
            if (remain < 0) {
                remain = 0;
            }
            document.getElementById('fRemain').value = remain + ' 天';
            document.getElementById('fStatus').value = (endDate < today) ? '已过期' : '可用';
        }

        // 弹窗保存：收集表单值 -> 校验 -> 更新数据 -> 持久化 -> 重新渲染
        function saveModal() {
            if (modalMode === 'view') {
                closeModal();
                return;
            }
            var plate = document.getElementById('fPlate').value.trim();
            var owner = document.getElementById('fOwner').value.trim();
            var phone = document.getElementById('fPhone').value.trim();
            var pay = document.getElementById('fPay').value;
            var startDate = document.getElementById('fStart').value;
            var endDate = document.getElementById('fEnd').value;
            var remark = document.getElementById('fRemark').value.trim();
            var errBox = document.getElementById('modalError');

            // 1. 必填与格式校验（校验失败给出文字提示并阻止保存）
            var errMsg = '';
            if (modalMode === 'edit') {
                if (plate === '') { errMsg = '车牌号不能为空'; }
                else if (!PLATE_REG.test(plate)) { errMsg = '车牌号格式不正确（如：赣A12345）'; }
                else if (owner === '') { errMsg = '车主姓名不能为空'; }
                else if (phone === '') { errMsg = '手机号不能为空'; }
                else if (!PHONE_REG.test(phone)) { errMsg = '手机号格式不正确（应为 11 位）'; }
            }
            if (errMsg === '') {
                if (pay === '' || Number(pay) <= 0) { errMsg = '缴费金额必须大于 0'; }
                else if (startDate === '' || endDate === '') { errMsg = '开始日期和结束日期不能为空'; }
                else if (endDate < startDate) { errMsg = '结束日期不能早于开始日期'; }
            }
            if (errMsg !== '') {
                errBox.textContent = errMsg;
                return;
            }

            // 2. 找到该条记录，更新可修改字段
            var card = findCardById(modalCardId);
            if (modalMode === 'edit') {
                card.plate = plate;
                card.ownerName = owner;
                card.phone = phone;
            }
            card.payAmount = Number(pay);
            card.startDate = startDate;
            card.endDate = endDate;
            card.remark = remark;

            // 3. 重新计算剩余天数与状态，保存并重新渲染
            updateCardState(card);
            saveMonthCardData(allCards);
            closeModal();
            renderTable();
        }

        /* ============================================
           删除：单条删除 / 批量删除
           ============================================ */

        // 单条删除：浏览器 confirm() 二次确认后过滤数组
        function deleteOne(id) {
            var card = findCardById(id);
            if (card === null) {
                return;
            }
            var ok = confirm('确定删除车牌号 ' + card.plate + ' 的月卡吗？');
            if (!ok) {
                return;
            }
            // filter() 过滤掉要删除的那条，得到新数组
            allCards = allCards.filter(function (c) {
                return c.id !== id;
            });
            filteredCards = allCards.slice();
            saveMonthCardData(allCards); // 持久化
            renderTable();
        }

        // 批量删除：获取勾选的 id 列表，确认后一次性过滤删除
        function batchDelete() {
            var checks = document.querySelectorAll('.rowCheck:checked');
            if (checks.length === 0) {
                alert('请先勾选要删除的月卡');
                return;
            }
            var ok = confirm('确定删除选中的 ' + checks.length + ' 张月卡吗？');
            if (!ok) {
                return;
            }
            // 收集勾选的 id
            var ids = [];
            for (var i = 0; i < checks.length; i++) {
                ids.push(Number(checks[i].getAttribute('data-id')));
            }
            // filter() 删除所有 id 在勾选列表里的记录
            allCards = allCards.filter(function (c) {
                return ids.indexOf(c.id) === -1;
            });
            filteredCards = allCards.slice();
            saveMonthCardData(allCards);
            renderTable();
        }

        /* ============================================
           事件绑定（页面加载完成后执行）
           ============================================ */
        window.onload = function () {
            // ---- 公共：侧边栏折叠 / 子菜单展开 ----
            var sidebar = document.getElementById('sidebar');
            var toggleBtn = document.getElementById('toggleBtn');
            toggleBtn.onclick = function () {
                sidebar.classList.toggle('collapsed');
            };
            var parents = document.querySelectorAll('.menu-parent');
            for (var i = 0; i < parents.length; i++) {
                parents[i].onclick = function () {
                    this.parentNode.classList.toggle('open');
                };
            }

            // ---- 初始化数据源（读取 localStorage，无数据时写入默认数据） ----
            allCards = readMonthCardData();
            filteredCards = allCards.slice();
            renderTable();

            // ---- 查询 / 重置 ----
            document.getElementById('btnSearch').onclick = doSearch;
            document.getElementById('btnReset').onclick = doReset;
            // 输入关键字后按回车也可以触发查询
            document.getElementById('searchKeyword').onkeydown = function (e) {
                if (e.key === 'Enter') {
                    doSearch();
                }
            };

            // ---- 添加月卡：跳转到增加月卡页面 ----
            document.getElementById('btnAdd').onclick = function () {
                location.href = 'addMonthCard.html';
            };

            // ---- 全选复选框：切换所有行复选框的勾选状态 ----
            document.getElementById('checkAll').onchange = function () {
                var checks = document.querySelectorAll('.rowCheck');
                for (var i = 0; i < checks.length; i++) {
                    checks[i].checked = this.checked;
                }
            };

            // ---- 行复选框变化后同步全选状态 ----
            var tableBody = document.getElementById('tableBody');
            tableBody.onchange = function (e) {
                if (e.target && e.target.className === 'rowCheck') {
                    syncCheckAll();
                }
            };

            // ---- 批量删除 ----
            document.getElementById('btnBatchDelete').onclick = batchDelete;

            // ---- 分页：上一页 / 下一页 / 切换每页条数 ----
            document.getElementById('btnPrev').onclick = function () {
                if (currentPage > 1) {
                    currentPage--;
                    renderTable();
                }
            };
            document.getElementById('btnNext').onclick = function () {
                if (currentPage < getTotalPages()) {
                    currentPage++;
                    renderTable();
                }
            };
            document.getElementById('pageSizeSelect').onchange = function () {
                pageSize = Number(this.value); // 切换每页条数
                currentPage = 1;               // 回到第 1 页
                renderTable();
            };

            // ---- 弹窗：关闭 / 取消 / 保存 ----
            document.getElementById('modalClose').onclick = closeModal;
            document.getElementById('modalCancel').onclick = closeModal;
            document.getElementById('modalSave').onclick = saveModal;
            // 点击灰色遮罩空白处也能关闭弹窗
            document.getElementById('modalMask').onclick = function (e) {
                if (e.target === this) {
                    closeModal();
                }
            };
            // 结束日期变化时实时刷新剩余天数与状态显示
            document.getElementById('fEnd').onchange = refreshModalState;

            // 弹窗表单不参与页面提交（防止在输入框按回车时刷新页面）
            document.getElementById('modalForm').onsubmit = function () {
                return false;
            };
        };
    </script>
</body>
</html>
